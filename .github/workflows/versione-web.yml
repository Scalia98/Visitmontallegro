# Versione web dell'app: a ogni modifica di www/ copia la cartella sul ramo gh-pages,
# che GitHub Pages pubblica su https://scalia98.github.io/Visitmontallegro/
name: Versione web
on:
  push:
    branches: [main]
    paths: ['www/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Copia www/ sul ramo gh-pages
        run: |
          cd www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Versione web da ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
