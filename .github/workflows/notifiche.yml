# Notifiche automatiche: quando su main cambia www/data/contenuti.json e ci sono eventi nuovi
# (o un evento passa da «da confermare» a confermato), avvisa gli iscritti con OneSignal.
# Tutto il funzionamento è spiegato in strumenti/notifica-eventi.mjs e nel LEGGIMI.
# Serve il segreto ONESIGNAL_API_KEY (Settings → Secrets and variables → Actions → Secrets).
# Prova: Run workflow con «Solo prova» e, in «telefono», l'id dell'iscrizione del telefono di prova.
name: Notifiche nuovi eventi
on:
  push:
    branches: [main]
    paths: ['www/data/contenuti.json']
  workflow_dispatch:
    inputs:
      eventi:
        description: 'Eventi da annunciare: id separati da virgola (vuoto, in prova = il prossimo evento)'
        required: false
        default: ''
      prova:
        description: 'Solo prova: manda solo al telefono di prova'
        type: boolean
        default: true
      telefono:
        description: 'Telefono di prova: id iscrizione (OneSignal → Users & subscriptions → Test subscriptions)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  notifica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Manda la notifica
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          PRIMA: ${{ github.event.before }}
          DOPO: ${{ github.sha }}
          EVENTI: ${{ inputs.eventi }}
          MANUALE: ${{ github.event_name == 'workflow_dispatch' }}
          PROVA: ${{ github.event_name == 'workflow_dispatch' && inputs.prova }}
        run: node strumenti/notifica-eventi.mjs
